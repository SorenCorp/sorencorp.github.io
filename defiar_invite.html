<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>De Fiar - Únete</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; color: #3F51B5; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #9E9E9E; margin-bottom: 20px; }
    p { font-size: 15px; color: #757575; line-height: 1.6; margin-bottom: 28px; }
    .store-btn {
      display: inline-block;
      background: #3F51B5;
      color: white;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
    }
    .open-btn {
      display: inline-block;
      background: transparent;
      color: #3F51B5;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      border: 2px solid #3F51B5;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🤝</div>
    <h1>De Fiar</h1>
    <p class="subtitle">Fiados digitales entre tenderos y clientes</p>
    <p id="msg">Descarga la app para ver tus fiados con tu tendero.</p>
    <a href="https://play.google.com/store/apps/details?id=com.sorencorp.fiadosapp"
       class="store-btn">
      📲 Descargar en Play Store
    </a>
    <button class="open-btn" id="open-btn" style="display:none">
      Abrir la app
    </button>
  </div>

  <script>
    const PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.sorencorp.fiadosapp';
    const params = new URLSearchParams(window.location.search);
    const tenderoId = params.get('t');

    if (tenderoId) {
      // Muestra botón para abrir la app si ya está instalada
      const openBtn = document.getElementById('open-btn');
      openBtn.style.display = 'inline-block';
      openBtn.addEventListener('click', function () {
        const encodedFallback = encodeURIComponent(PLAY_STORE);
        window.location.href =
          'intent://connect/' + tenderoId +
          '#Intent;scheme=defiar;package=com.sorencorp.fiadosapp;' +
          'S.browser_fallback_url=' + encodedFallback + ';end';
      });
    }
  </script>
</body>
</html>
